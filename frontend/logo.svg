<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Orchestrator Crown Gold Gradient -->
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Nucleus Radial Glow -->
    <radialGradient id="coreNucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Node Glow Filters -->
    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Tile (Modern Squircle with Cyber Glow Border) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Orchestration Web (Constellation Connecting Rays) -->
  <g opacity="0.85" filter="url(#softGlow)">
    <!-- Diagonal cross connections -->
    <line x1="256" y1="256" x2="256" y2="104" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 6" />
    <line x1="256" y1="256" x2="408" y2="256" stroke="#c084fc" stroke-width="4" stroke-dasharray="8 6" />
    <line x1="256" y1="256" x2="256" y2="408" stroke="#818cf8" stroke-width="4" stroke-dasharray="8 6" />
    <line x1="256" y1="256" x2="104" y2="256" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 6" />

    <!-- Orbital harmonic ring -->
    <circle cx="256" cy="256" r="152" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.6" />
    <circle cx="256" cy="256" r="102" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Agent Satellite 1: Top (Frontend / Interface Node) -->
  <g filter="url(#hyperGlow)">
    <circle cx="256" cy="104" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />
    <circle cx="256" cy="104" r="14" fill="#38bdf8" />
    <!-- Pulse rings -->
    <circle cx="256" cy="104" r="38" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Agent Satellite 2: Right (QA / Review Node) -->
  <g filter="url(#hyperGlow)">
    <circle cx="408" cy="256" r="28" fill="#0f172a" stroke="#c084fc" stroke-width="5" />
    <circle cx="408" cy="256" r="14" fill="#c084fc" />
    <circle cx="408" cy="256" r="38" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Agent Satellite 3: Bottom (Backend / Database Node) -->
  <g filter="url(#hyperGlow)">
    <circle cx="256" cy="408" r="28" fill="#0f172a" stroke="#818cf8" stroke-width="5" />
    <circle cx="256" cy="408" r="14" fill="#818cf8" />
    <circle cx="256" cy="408" r="38" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Agent Satellite 4: Left (DevOps / Scripts Node) -->
  <g filter="url(#hyperGlow)">
    <circle cx="104" cy="256" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="5" />
    <circle cx="104" cy="256" r="14" fill="#f59e0b" />
    <circle cx="104" cy="256" r="38" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Central Orchestrator Core (Maestro Crown & Quantum Nexus) -->
  <g filter="url(#hyperGlow)">
    <!-- Outer Quantum Shield (Hexagonal Nucleus) -->
    <polygon points="256,182 320,219 320,293 256,330 192,293 192,219" fill="#090d16" stroke="url(#borderGrad)" stroke-width="6" />

    <!-- Radiant Inner Glow -->
    <circle cx="256" cy="256" r="62" fill="url(#coreNucleus)" />

    <!-- Maestro Crown Emblem (Central Vector) -->
    <path d="M222 278 L232 236 L256 254 L280 236 L290 278 Z" fill="url(#crownGold)" stroke="#fef08a" stroke-width="2" />
    <circle cx="232" cy="232" r="4.5" fill="#ffffff" />
    <circle cx="256" cy="250" r="5" fill="#ffffff" />
    <circle cx="280" cy="232" r="4.5" fill="#ffffff" />

    <!-- Core Hyper-Pulse Center -->
    <circle cx="256" cy="256" r="6" fill="#ffffff" />
  </g>
</svg>
